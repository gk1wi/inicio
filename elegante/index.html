<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Curated Journey</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Journey">
<meta name="theme-color" content="#0d0d0f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d0f;--sf:#151518;--line:rgba(255,255,255,.09);--ink:#f3efe8;--dim:#8d8a84;--gold:#c9a96a;
--serif:'Cormorant Garamond',Georgia,serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,-apple-system,system-ui,sans-serif}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{padding:14px 24px 6px;display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--dim)}
header b{color:var(--gold);font-weight:500}
main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow:auto;padding:8px 24px 130px;display:none}
.view.on{display:block}
#mapview{padding:0}
#map{position:absolute;inset:0;background:#0a0a0c}
h1{font:500 38px/1.05 var(--serif);margin:10px 0 6px;letter-spacing:-.01em}
.sub{color:var(--dim);margin:0 0 26px;max-width:30ch}
.co{margin-bottom:30px}
.ch{display:flex;align-items:center;gap:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.mono{width:40px;height:40px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;font:500 20px var(--serif);color:var(--gold)}
.ch h2{font:500 24px var(--serif);margin:0;flex:1}
.ch small{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.pk{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;color:var(--ink);border:0;border-bottom:1px solid var(--line);padding:16px 4px;font:inherit;transition:background .25s}
.pk .n{flex:1}.pk small{display:block;color:var(--dim);font-size:13px}
.pk .chk{width:22px;height:22px;border-radius:50%;border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;font-size:11px;color:#111;transition:.25s}
.pk.sel{background:linear-gradient(90deg,rgba(201,169,106,.12),transparent)}
.pk.sel .chk{background:var(--gold);border-color:var(--gold)}
.link{background:none;border:0;color:var(--gold);font:inherit;font-size:12px;letter-spacing:.2em;text-transform:uppercase;padding:0 0 4px;border-bottom:1px solid rgba(201,169,106,.4);margin-bottom:28px}
nav{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:1000;display:flex;gap:6px;padding:6px;border-radius:999px;background:rgba(21,21,24,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.6)}
nav button{flex:1;padding:14px 10px;border-radius:999px;border:0;background:none;color:var(--dim);font:500 12px Inter,sans-serif;letter-spacing:.18em;text-transform:uppercase;transition:.25s}
nav button.on{background:var(--ink);color:#111}
nav button:disabled{opacity:.35}
#sheet{position:absolute;left:16px;right:16px;bottom:96px;z-index:900;background:rgba(21,21,24,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:22px;padding:18px 20px 8px;max-height:42%;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.5)}
#sheet h3{font:500 26px var(--serif);margin:0}
.meta{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:2px 0 8px}
.note{color:var(--dim);font-size:12px;margin:0 0 4px}
.st{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line);transition:opacity .3s}
.st .b{width:30px;height:30px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;font:500 16px var(--serif);color:var(--gold)}
.st b{font:500 19px var(--serif)}.st small{display:block;color:var(--dim);font-size:13px}
.st.done{opacity:.4}.st.done .b{background:var(--gold);color:#111}
.pin{width:34px;height:34px;border-radius:50%;background:#0d0d0f;border:1.5px solid var(--gold);display:grid;place-items:center;font:600 18px var(--serif);color:var(--gold);box-shadow:0 0 0 5px rgba(201,169,106,.15),0 6px 18px rgba(0,0,0,.6)}
.me{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #0d0d0f;box-shadow:0 0 0 0 rgba(255,255,255,.5);animation:pulse 2.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 20px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.route{stroke-dasharray:1 10;stroke-linecap:round;animation:dash 2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-22}}
@media (prefers-reduced-motion:reduce){.route,.me{animation:none}}
.leaflet-tile-pane{filter:invert(1) grayscale(1) sepia(.25) brightness(.68) contrast(1.15)}
.leaflet-container{font:inherit;background:#0a0a0c}
.leaflet-control-attribution{background:rgba(13,13,15,.7)!important;color:var(--dim)!important;font-size:9px!important}
.leaflet-control-attribution a{color:var(--dim)!important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#151518;color:var(--ink);border:1px solid var(--line)}
.leaflet-popup-content{font:500 18px var(--serif);margin:10px 14px}
</style>
</head>
<body>
<header><span>Curated Journey</span><b id="coins">0 selected</b></header>
<main>
  <section id="pk" class="view on">
    <h1>Select your<br>packages</h1>
    <p class="sub">Choose from our partner houses. Your route is composed around them.</p>
    <button class="link" id="shuffle">Refresh selection</button>
    <div id="list"></div>
  </section>
  <section id="mapview" class="view"><div id="map"></div><div id="sheet"></div></section>
</main>
<nav>
  <button id="tPk" class="on">Packages</button>
  <button id="tGo" disabled>Begin journey</button>
</nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ===== CONFIG: replace the coordinates with the real ones ===== */
const COMPANIES=[
 {id:'vicke',name:'Vicke',mono:'V',lat:20.10110,lng:-98.75910},   // <- Vicke's real location
 {id:'yesi',name:'Yesi',mono:'Y',lat:20.10480,lng:-98.75300},
 {id:'c1',name:'Company 1',mono:'1',lat:20.09700,lng:-98.76500},
 {id:'c2',name:'Company 2',mono:'2',lat:20.10900,lng:-98.76300}
];
const POOL=['Signature gift box','Artisan bakery selection','Handcrafted set','Curated care package','Local delicacies','Tasting collection','Botanical arrangement','Coffee ritual kit','Scented candle trio','Chocolate atelier box','Weekend discovery kit','Private reserve'];
/* ============================================================== */
const $=s=>document.querySelector(s);
let packs={},sel=new Set(),map,layers=[];
function shuffleAll(){packs={};sel.clear();COMPANIES.forEach(c=>{
  const p=[...POOL].sort(()=>Math.random()-.5).slice(0,3);
  packs[c.id]=p.map((n,i)=>({key:c.id+i,name:n,price:(Math.floor(Math.random()*18)+5)*10}));});render()}
function render(){
 $('#list').innerHTML=COMPANIES.map(c=>`<div class="co"><div class="ch"><div class="mono">${c.mono}</div><h2>${c.name}</h2><small>3 packages</small></div>`+
  packs[c.id].map(p=>`<button class="pk ${sel.has(p.key)?'sel':''}" data-k="${p.key}"><span class="n">${p.name}<small>$${p.price} MXN</small></span><span class="chk">${sel.has(p.key)?'✓':''}</span></button>`).join('')+`</div>`).join('');
 document.querySelectorAll('.pk').forEach(b=>b.onclick=()=>{const k=b.dataset.k;sel.has(k)?sel.delete(k):sel.add(k);render()});
 $('#coins').textContent=sel.size+' selected';$('#tGo').disabled=!chosen().length;
}
const chosen=()=>COMPANIES.filter(c=>packs[c.id]&&packs[c.id].some(p=>sel.has(p.key)));
function show(v){$('#pk').classList.toggle('on',v=='pk');$('#mapview').classList.toggle('on',v=='map');
 $('#tPk').classList.toggle('on',v=='pk');$('#tGo').classList.toggle('on',v=='map');if(v=='map'&&map)setTimeout(()=>map.invalidateSize(),50)}
$('#tPk').onclick=()=>show('pk');
$('#shuffle').onclick=shuffleAll;
$('#tGo').onclick=()=>{show('map');startJourney()};
const pin=c=>L.divIcon({className:'',iconSize:[34,34],iconAnchor:[17,17],html:`<div class="pin">${c.mono}</div>`});
function getPos(){return new Promise(res=>{const v=COMPANIES[0],fb={lat:v.lat-.012,lng:v.lng-.009,fake:true};
 if(!navigator.geolocation)return res(fb);
 navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude}),()=>res(fb),{enableHighAccuracy:true,timeout:8000})})}
async function route(pts,prof){
 const base=prof=='foot'?'https://routing.openstreetmap.de/routed-foot/route/v1/foot/':'https://router.project-osrm.org/route/v1/driving/';
 const r=await fetch(base+pts.map(p=>p.lng+','+p.lat).join(';')+'?overview=full&geometries=geojson');
 const j=await r.json();if(!j.routes||!j.routes[0])throw 0;return j.routes[0]}
async function startJourney(){
 if(!map){map=L.map('map',{zoomControl:false});
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map)}
 layers.forEach(l=>map.removeLayer(l));layers=[];
 $('#sheet').innerHTML='<h3>Composing your route…</h3>';
 const me=await getPos();
 const stops=[...chosen()].sort((a,b)=>(a.id=='vicke'?-1:b.id=='vicke'?1:0)); // Vicke is always the first stop
 const pts=[me,...stops];
 layers.push(L.marker([me.lat,me.lng],{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[14,14],iconAnchor:[7,7]})}).addTo(map));
 stops.forEach(c=>layers.push(L.marker([c.lat,c.lng],{icon:pin(c)}).addTo(map).bindPopup(c.name)));
 let line,dist=0,dur=0,note='';
 try{let r;try{r=await route(pts,'foot');note='on foot'}catch(e){r=await route(pts,'car');note='by car'}
  line=r.geometry.coordinates.map(c=>[c[1],c[0]]);dist=r.distance;dur=r.duration;
 }catch(e){line=pts.map(p=>[p.lat,p.lng]);note='direct line'}
 layers.push(L.polyline(line,{color:'#000',weight:8,opacity:.55}).addTo(map));
 layers.push(L.polyline(line,{color:'#c9a96a',weight:3.5,className:'route'}).addTo(map));
 map.fitBounds(L.latLngBounds(pts.map(p=>[p.lat,p.lng])).pad(.3));
 const km=(dist/1000).toFixed(1),min=Math.round(dur/60);
 $('#sheet').innerHTML=`<h3>Your journey</h3><div class="meta">${stops.length} stop${stops.length>1?'s':''}${dist?` · ${km} km · ${min} min · ${note}`:' · '+note}</div>`+
  (me.fake?'<p class="note">Location unavailable — using a demonstration starting point.</p>':'')+
  stops.map((c,i)=>{const n=packs[c.id].filter(p=>sel.has(p.key)).map(p=>p.name).join(', ');
   return `<div class="st"><div class="b">${i+1}</div><div><b>${c.name}</b><small>${n}</small></div></div>`}).join('');
 document.querySelectorAll('.st').forEach(e=>e.onclick=()=>e.classList.toggle('done'));
}
shuffleAll();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
