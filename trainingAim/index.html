<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>K1WI AIM</title>
<meta name="description" content="Entrena tu puntería. Rápido, preciso, offline.">
<meta name="theme-color" content="#12161C">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#12161C;
    --bg-raised:#181D25;
    --line:#252C36;
    --text:#E8EAED;
    --text-dim:#8B93A1;
    --signal:#F5C518;
    --signal-dim:#8A7318;
    --miss:#E5484D;
    --hit:#4FD1C5;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-ui);
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
    touch-action:none;
  }
  #app{position:relative; width:100vw; height:100vh;}

  /* ---------- HUD ---------- */
  #hud{
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 24px;
    font-family:var(--font-mono);
    font-size:14px;
    letter-spacing:0.02em;
    color:var(--text-dim);
    z-index:5;
    pointer-events:none;
  }
  #hud .stat{color:var(--text); font-weight:600;}
  #hud .stat.miss{color:var(--miss);}
  #hud-left, #hud-right{display:flex; gap:22px;}

  /* ---------- Play field ---------- */
  #field{
    position:absolute; inset:0;
    cursor:none;
  }
  .target{
    position:absolute;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffe07a, var(--signal) 55%, var(--signal-dim) 100%);
    box-shadow:0 0 0 2px rgba(245,197,24,0.25), 0 6px 18px rgba(0,0,0,0.5);
    transform:translate(-50%,-50%) scale(0);
    animation:pop 120ms cubic-bezier(.2,1.4,.4,1) forwards;
    will-change:transform;
  }
  @keyframes pop{ to{ transform:translate(-50%,-50%) scale(1); } }
  .target::after{
    content:"";
    position:absolute; inset:28%;
    border-radius:50%;
    background:rgba(18,22,28,0.35);
  }
  .impact{
    position:absolute;
    width:10px; height:10px;
    border-radius:50%;
    border:2px solid var(--hit);
    transform:translate(-50%,-50%);
    animation:ring 320ms ease-out forwards;
    pointer-events:none;
  }
  @keyframes ring{
    from{ opacity:0.9; width:10px; height:10px; }
    to{ opacity:0; width:70px; height:70px; }
  }
  .miss-mark{
    position:absolute;
    width:16px; height:16px;
    transform:translate(-50%,-50%);
    pointer-events:none;
    animation:missfade 260ms ease-out forwards;
  }
  .miss-mark::before, .miss-mark::after{
    content:""; position:absolute; left:0; top:50%; width:100%; height:2px;
    background:var(--miss); border-radius:1px;
  }
  .miss-mark::before{ transform:rotate(45deg); }
  .miss-mark::after{ transform:rotate(-45deg); }
  @keyframes missfade{ from{opacity:0.9;} to{opacity:0;} }

  #crosshair{
    position:absolute; width:22px; height:22px;
    transform:translate(-50%,-50%);
    pointer-events:none;
    z-index:6;
  }
  #crosshair::before, #crosshair::after{
    content:""; position:absolute; background:var(--text);
  }
  #crosshair::before{ left:50%; top:0; width:2px; height:100%; margin-left:-1px; opacity:0.7;}
  #crosshair::after{ top:50%; left:0; height:2px; width:100%; margin-top:-1px; opacity:0.7;}

  /* ---------- Overlays ---------- */
  .overlay{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg);
    z-index:10;
    cursor:default;
  }
  .hidden{ display:none !important; }

  .panel{
    width:min(420px, 88vw);
    display:flex; flex-direction:column; align-items:center;
    gap:28px;
    text-align:center;
  }
  .brand{
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .brand .mark{
    width:56px; height:56px;
    display:flex; align-items:center; justify-content:center;
  }
  .brand h1{
    font-size:28px;
    letter-spacing:-0.01em;
    font-weight:700;
  }
  .brand h1 span{ color:var(--signal); }
  .brand p{ color:var(--text-dim); font-size:14px; }

  .field-group{
    width:100%;
    display:flex; flex-direction:column; gap:14px;
    text-align:left;
  }
  .field-row{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px;
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
  }
  .field-row label{ font-size:13px; color:var(--text-dim); }
  .seg{
    display:flex; gap:6px;
  }
  .seg button{
    font-family:var(--font-mono);
    font-size:13px;
    color:var(--text-dim);
    background:transparent;
    border:1px solid var(--line);
    border-radius:6px;
    padding:6px 10px;
    cursor:pointer;
  }
  .seg button.active{
    color:var(--bg);
    background:var(--signal);
    border-color:var(--signal);
    font-weight:700;
  }

  button.primary{
    width:100%;
    font-family:var(--font-ui);
    font-size:16px;
    font-weight:700;
    color:var(--bg);
    background:var(--signal);
    border:none;
    border-radius:10px;
    padding:15px 18px;
    cursor:pointer;
    letter-spacing:0.01em;
  }
  button.primary:active{ transform:translateY(1px); }
  button.ghost{
    width:100%;
    font-family:var(--font-ui);
    font-size:14px;
    color:var(--text-dim);
    background:transparent;
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 18px;
    cursor:pointer;
  }

  .hint{ font-size:12px; color:var(--text-dim); }

  /* results */
  .results-grid{
    width:100%;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .result-cell{
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px;
    text-align:left;
  }
  .result-cell .num{
    font-family:var(--font-mono);
    font-size:24px;
    font-weight:700;
  }
  .result-cell .lbl{
    font-size:11px;
    color:var(--text-dim);
    margin-top:2px;
  }
  .result-cell.wide{ grid-column:1 / -1; }

  #countdown-num{
    font-family:var(--font-mono);
    font-size:96px;
    font-weight:700;
    color:var(--signal);
  }

  @media (max-width:420px){
    .brand h1{ font-size:24px; }
    #hud{ font-size:12px; padding:14px 16px; }
    #hud-left, #hud-right{ gap:14px; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div id="hud-left">
      <div>OBJ <span class="stat" id="hud-progress">0/30</span></div>
      <div>PREC <span class="stat" id="hud-acc">100%</span></div>
    </div>
    <div id="hud-right">
      <div>FALLOS <span class="stat miss" id="hud-miss">0</span></div>
      <div id="hud-time">0.000s</div>
    </div>
  </div>

  <!-- Play field -->
  <div id="field" class="hidden"></div>
  <div id="crosshair" class="hidden"></div>

  <!-- Start screen -->
  <div id="screen-start" class="overlay">
    <div class="panel">
      <div class="brand">
        <div class="mark">
          <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
            <circle cx="28" cy="28" r="20" stroke="#F5C518" stroke-width="3"/>
            <circle cx="28" cy="28" r="11" stroke="#F5C518" stroke-width="3"/>
            <circle cx="28" cy="28" r="3.2" fill="#F5C518"/>
            <line x1="28" y1="1" x2="28" y2="9" stroke="#F5C518" stroke-width="3"/>
            <line x1="28" y1="47" x2="28" y2="55" stroke="#F5C518" stroke-width="3"/>
            <line x1="1" y1="28" x2="9" y2="28" stroke="#F5C518" stroke-width="3"/>
            <line x1="47" y1="28" x2="55" y2="28" stroke="#F5C518" stroke-width="3"/>
          </svg>
        </div>
        <h1>K1WI<span>AIM</span></h1>
        <p>Entrena tu puntería. Modo Desafío.</p>
      </div>

      <div class="field-group">
        <div class="field-row">
          <label>Objetivos</label>
          <div class="seg" id="seg-count">
            <button data-val="15">15</button>
            <button data-val="30" class="active">30</button>
            <button data-val="60">60</button>
          </div>
        </div>
        <div class="field-row">
          <label>Tamaño</label>
          <div class="seg" id="seg-size">
            <button data-val="30">S</button>
            <button data-val="42" class="active">M</button>
            <button data-val="58">L</button>
          </div>
        </div>
      </div>

      <button class="primary" id="btn-start">Jugar</button>
      <p class="hint">Haz clic o toca los objetivos. Falla lo menos posible.</p>
    </div>
  </div>

  <!-- Countdown -->
  <div id="screen-countdown" class="overlay hidden">
    <div id="countdown-num">3</div>
  </div>

  <!-- Results -->
  <div id="screen-results" class="overlay hidden">
    <div class="panel">
      <div class="brand">
        <h1>Resultados</h1>
      </div>
      <div class="results-grid">
        <div class="result-cell">
          <div class="num" id="res-time">0.00s</div>
          <div class="lbl">TIEMPO TOTAL</div>
        </div>
        <div class="result-cell">
          <div class="num" id="res-acc">100%</div>
          <div class="lbl">PRECISIÓN</div>
        </div>
        <div class="result-cell">
          <div class="num" id="res-avg">0ms</div>
          <div class="lbl">PROMEDIO / OBJETIVO</div>
        </div>
        <div class="result-cell">
          <div class="num" id="res-miss">0</div>
          <div class="lbl">FALLOS</div>
        </div>
        <div class="result-cell wide">
          <div class="num" id="res-best">0ms</div>
          <div class="lbl">REACCIÓN MÁS RÁPIDA</div>
        </div>
      </div>
      <button class="primary" id="btn-retry">Reintentar</button>
      <button class="ghost" id="btn-menu">Menú</button>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";

  var els = {
    hud: document.getElementById('hud'),
    hudProgress: document.getElementById('hud-progress'),
    hudAcc: document.getElementById('hud-acc'),
    hudMiss: document.getElementById('hud-miss'),
    hudTime: document.getElementById('hud-time'),
    field: document.getElementById('field'),
    crosshair: document.getElementById('crosshair'),
    screenStart: document.getElementById('screen-start'),
    screenCountdown: document.getElementById('screen-countdown'),
    countdownNum: document.getElementById('countdown-num'),
    screenResults: document.getElementById('screen-results'),
    btnStart: document.getElementById('btn-start'),
    btnRetry: document.getElementById('btn-retry'),
    btnMenu: document.getElementById('btn-menu'),
    segCount: document.getElementById('seg-count'),
    segSize: document.getElementById('seg-size'),
    resTime: document.getElementById('res-time'),
    resAcc: document.getElementById('res-acc'),
    resAvg: document.getElementById('res-avg'),
    resMiss: document.getElementById('res-miss'),
    resBest: document.getElementById('res-best')
  };

  var settings = { count: 30, size: 42 };

  function bindSeg(container, key){
    container.addEventListener('click', function(e){
      var btn = e.target.closest('button');
      if(!btn) return;
      Array.prototype.forEach.call(container.children, function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      settings[key] = parseInt(btn.dataset.val, 10);
    });
  }
  bindSeg(els.segCount, 'count');
  bindSeg(els.segSize, 'size');

  var state = null;

  function showScreen(name){
    els.screenStart.classList.toggle('hidden', name !== 'start');
    els.screenCountdown.classList.toggle('hidden', name !== 'countdown');
    els.screenResults.classList.toggle('hidden', name !== 'results');
    var playing = (name === 'playing');
    els.hud.classList.toggle('hidden', !playing);
    els.field.classList.toggle('hidden', !playing);
    els.crosshair.classList.toggle('hidden', !playing);
  }

  function startCountdown(){
    showScreen('countdown');
    var n = 3;
    els.countdownNum.textContent = n;
    var iv = setInterval(function(){
      n -= 1;
      if(n <= 0){
        clearInterval(iv);
        beginGame();
      } else {
        els.countdownNum.textContent = n;
      }
    }, 550);
  }

  function beginGame(){
    state = {
      total: settings.count,
      size: settings.size,
      spawned: 0,
      hits: 0,
      misses: 0,
      reactions: [],
      startTime: null,
      currentSpawnTime: 0,
      currentTarget: null,
      timerRAF: null
    };
    els.field.innerHTML = '';
    showScreen('playing');
    state.startTime = performance.now();
    tickTimer();
    spawnTarget();
  }

  function tickTimer(){
    if(!state) return;
    var elapsed = (performance.now() - state.startTime) / 1000;
    els.hudTime.textContent = elapsed.toFixed(3) + 's';
    state.timerRAF = requestAnimationFrame(tickTimer);
  }

  function rand(min, max){ return Math.random() * (max - min) + min; }

  function spawnTarget(){
    if(!state) return;
    var rect = els.field.getBoundingClientRect();
    var margin = state.size / 2 + 12;
    var topMargin = margin + 40;
    var x = rand(margin, rect.width - margin);
    var y = rand(topMargin, rect.height - margin);

    var el = document.createElement('div');
    el.className = 'target';
    el.style.width = state.size + 'px';
    el.style.height = state.size + 'px';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.addEventListener('pointerdown', onHit);
    els.field.appendChild(el);

    state.currentTarget = el;
    state.currentSpawnTime = performance.now();
  }

  function spawnImpact(x, y, kind){
    var el = document.createElement('div');
    el.className = kind === 'hit' ? 'impact' : 'miss-mark';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    els.field.appendChild(el);
    setTimeout(function(){ el.remove(); }, 400);
  }

  function onHit(e){
    e.stopPropagation();
    if(!state || e.target !== state.currentTarget) return;
    var reaction = performance.now() - state.currentSpawnTime;
    state.hits += 1;
    state.spawned += 1;
    state.reactions.push(reaction);

    var rect = state.currentTarget.getBoundingClientRect();
    var fieldRect = els.field.getBoundingClientRect();
    spawnImpact(rect.left + rect.width/2 - fieldRect.left, rect.top + rect.height/2 - fieldRect.top, 'hit');

    state.currentTarget.remove();
    state.currentTarget = null;
    updateHud();
    advance();
  }

  function onFieldMiss(e){
    if(!state || !state.currentTarget) return;
    if(e.target === state.currentTarget) return;
    state.misses += 1;
    var fieldRect = els.field.getBoundingClientRect();
    spawnImpact(e.clientX - fieldRect.left, e.clientY - fieldRect.top, 'miss');
    updateHud();
  }
  els.field.addEventListener('pointerdown', onFieldMiss);

  els.field.addEventListener('pointermove', function(e){
    var rect = els.field.getBoundingClientRect();
    els.crosshair.style.left = (e.clientX) + 'px';
    els.crosshair.style.top = (e.clientY) + 'px';
  });

  function updateHud(){
    els.hudProgress.textContent = state.spawned + '/' + state.total;
    var attempts = state.hits + state.misses;
    var acc = attempts === 0 ? 100 : Math.round((state.hits / attempts) * 100);
    els.hudAcc.textContent = acc + '%';
    els.hudMiss.textContent = state.misses;
  }

  function advance(){
    if(state.spawned >= state.total){
      endGame();
    } else {
      spawnTarget();
    }
  }

  function endGame(){
    cancelAnimationFrame(state.timerRAF);
    var totalTime = (performance.now() - state.startTime) / 1000;
    var attempts = state.hits + state.misses;
    var acc = attempts === 0 ? 100 : Math.round((state.hits / attempts) * 100);
    var avgMs = state.reactions.length
      ? Math.round(state.reactions.reduce(function(a,b){return a+b;},0) / state.reactions.length)
      : 0;
    var bestMs = state.reactions.length ? Math.round(Math.min.apply(null, state.reactions)) : 0;

    els.resTime.textContent = totalTime.toFixed(2) + 's';
    els.resAcc.textContent = acc + '%';
    els.resAvg.textContent = avgMs + 'ms';
    els.resMiss.textContent = state.misses;
    els.resBest.textContent = bestMs + 'ms';

    state = null;
    showScreen('results');
  }

  els.btnStart.addEventListener('click', startCountdown);
  els.btnRetry.addEventListener('click', startCountdown);
  els.btnMenu.addEventListener('click', function(){ showScreen('start'); });

  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && state){
      cancelAnimationFrame(state.timerRAF);
      state = null;
      showScreen('start');
    }
  });

  // Register service worker for offline/installable support
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
</script>
</body>
</html>
