<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Waypoint</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Waypoint">
<meta name="theme-color" content="#f3efe6">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3efe6;--ink:#15171c;--dim:#6d6f76;--card:#fff;--line:#e3ded2;
--d:'Bricolage Grotesque',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'DM Sans',-apple-system,system-ui,sans-serif}
body{padding-top:env(safe-area-inset-top)}
.view{position:absolute;inset:0;overflow:auto;padding:calc(env(safe-area-inset-top) + 18px) 18px 150px;display:none}
.view.on{display:block}
#mapview{padding:0;overflow:hidden}
#map{position:absolute;inset:0}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px}
.logo{display:flex;align-items:center;gap:8px;font:800 20px var(--d);letter-spacing:-.02em}
.logo i{width:22px;height:22px;border-radius:50% 50% 50% 4px;background:var(--ink);transform:rotate(-45deg);display:block}
.count{background:var(--ink);color:#fff;border-radius:99px;padding:6px 12px;font-size:13px}
h1{font:800 44px/.98 var(--d);letter-spacing:-.035em;margin:26px 0 8px}
h1 em{font-style:normal;background:linear-gradient(transparent 62%,#ffd25e 62%)}
.sub{color:var(--dim);margin:0 0 20px;max-width:32ch}
.tools{display:flex;justify-content:flex-end;margin-bottom:14px}
.ghost{border:1.5px solid var(--ink);background:none;border-radius:99px;padding:8px 14px;font:700 13px 'DM Sans';color:var(--ink)}
.co{border-radius:28px;padding:16px;margin-bottom:16px;background:var(--t)}
.ch{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.mono{width:46px;height:46px;border-radius:16px;background:var(--c);color:#fff;display:grid;place-items:center;font:800 24px var(--d);transform:rotate(-6deg)}
.ch h2{font:800 25px var(--d);letter-spacing:-.02em;margin:0;flex:1}
.ch small{font-weight:700;color:var(--c);font-size:12px}
.pk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid transparent;border-radius:18px;padding:13px 14px;margin-top:8px;font:inherit;color:var(--ink);transition:transform .15s,border-color .2s}
.pk:active{transform:scale(.98)}
.pk .n{flex:1;font-weight:700}.pk small{display:block;color:var(--dim);font-weight:400}
.pk .chk{width:30px;height:30px;border-radius:50%;background:var(--t);color:var(--c);display:grid;place-items:center;font:700 18px var(--d);transition:.2s}
.pk.sel{border-color:var(--c)}
.pk.sel .chk{background:var(--c);color:#fff;transform:rotate(90deg)}
#bar{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:1000;display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;border:0;border-radius:24px;padding:12px 12px 12px 20px;box-shadow:0 14px 40px rgba(20,22,28,.35);transform:translateY(160%);transition:transform .35s cubic-bezier(.2,.9,.3,1.2);font:inherit;text-align:left}
#bar.on{transform:none}
#bar .t{flex:1;font-weight:700}#bar .t small{display:block;font-weight:400;opacity:.65}
#bar .go{background:#ffd25e;color:var(--ink);border-radius:16px;padding:13px 18px;font:800 15px var(--d)}
.fab{position:absolute;z-index:900;top:calc(env(safe-area-inset-top) + 14px);background:#fff;border:0;border-radius:99px;padding:11px 16px;font:700 14px 'DM Sans';color:var(--ink);box-shadow:0 6px 20px rgba(0,0,0,.18)}
#back{left:14px}#fit{right:14px}
#sheet{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:900;background:#fff;border-radius:30px;padding:10px 20px 8px;max-height:52%;overflow:auto;box-shadow:0 -6px 40px rgba(0,0,0,.2)}
#sheet:before{content:'';display:block;width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.stats{display:flex;gap:10px;margin-bottom:6px}
.stat{flex:1;background:var(--bg);border-radius:16px;padding:10px 12px}
.stat b{display:block;font:800 26px/1 var(--d);letter-spacing:-.02em}.stat span{font-size:12px;color:var(--dim)}
.note{color:var(--dim);font-size:12px;margin:8px 0 0}
.tl{margin-top:10px}
.st{display:flex;gap:14px;align-items:flex-start;padding-bottom:16px;position:relative}
.st:not(:last-child):before{content:'';position:absolute;left:17px;top:38px;bottom:0;width:2px;background:repeating-linear-gradient(var(--line) 0 4px,transparent 4px 8px)}
.st .b{flex:none;width:36px;height:36px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center;font:800 18px var(--d)}
.st b{font:800 18px var(--d);letter-spacing:-.01em}.st small{display:block;color:var(--dim)}
.st.done .b{background:#d9d6cc}.st.done div:last-child{opacity:.45;text-decoration:line-through}
.pin{width:40px;height:40px;border-radius:50% 50% 50% 6px;transform:rotate(-45deg);background:var(--c);border:3px solid #fff;box-shadow:0 8px 18px rgba(0,0,0,.3);display:grid;place-items:center}
.pin i{transform:rotate(45deg);font:800 18px var(--d);color:#fff;font-style:normal}
.me{width:18px;height:18px;border-radius:50%;background:#2f6bff;border:3px solid #fff;box-shadow:0 0 0 0 rgba(47,107,255,.5);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 22px rgba(47,107,255,0)}100%{box-shadow:0 0 0 0 rgba(47,107,255,0)}}
.route{stroke-dasharray:2 11;stroke-linecap:round;animation:dash 1.6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-26}}
@media (prefers-reduced-motion:reduce){.route,.me{animation:none}}
.leaflet-tile-pane{filter:saturate(.3) contrast(1.02) brightness(1.04) sepia(.12)}
.leaflet-container{background:#ece8de;font:inherit}
.leaflet-control-attribution{font-size:9px!important;margin-bottom:2px}
.leaflet-top{top:60px}
.startbtn{width:100%;background:var(--ink);color:#fff;border:0;border-radius:18px;padding:16px;font:800 18px var(--d);margin:12px 0 8px}
.row{display:flex;gap:8px;margin-bottom:8px}
.row .ghost{flex:1;text-align:center;text-decoration:none;font-size:12.5px;padding:10px 6px}
#nav{position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 10px);z-index:950;background:var(--ink);color:#fff;border-radius:26px;padding:14px 16px;display:none;gap:14px;align-items:center;box-shadow:0 12px 36px rgba(0,0,0,.35)}
#nav.on{display:flex}
#nav .ar{flex:none;width:62px;height:62px;border-radius:20px;background:#ffd25e;color:var(--ink);display:grid;place-items:center;font:800 36px var(--d)}
#nav .d{font:800 32px/1 var(--d);letter-spacing:-.02em}#nav .i{opacity:.9;margin-top:3px;line-height:1.25}
#navbar{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:950;background:#fff;border-radius:28px;padding:14px 14px 14px 20px;display:none;align-items:center;gap:10px;box-shadow:0 -6px 40px rgba(0,0,0,.2)}
#navbar.on{display:flex}
#navbar .e{flex:1}#navbar .e b{display:block;font:800 28px/1 var(--d);letter-spacing:-.02em}#navbar .e span{color:var(--dim);font-size:13px}
.rb{width:46px;height:46px;border-radius:50%;border:0;background:var(--bg);font-size:20px}
.end{background:#e5393d;color:#fff;border:0;border-radius:16px;padding:14px 20px;font:800 16px var(--d)}
body.navmode #back,body.navmode #fit,body.navmode #sheet{display:none}
#info{right:14px;top:calc(env(safe-area-inset-top) + 66px);width:40px;height:40px;padding:0;font-size:19px;line-height:40px}
#credit{position:absolute;z-index:900;right:62px;top:calc(env(safe-area-inset-top) + 72px);display:none;background:#fff;border-radius:12px;padding:9px 12px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
#credit.on{display:block}#credit a{color:var(--ink);text-decoration:none;font-weight:700}
body.navmode #info{top:calc(env(safe-area-inset-top) + 118px)}body.navmode #credit{top:calc(env(safe-area-inset-top) + 124px)}
</style>
</head>
<body>
<section id="pk" class="view on">
  <div class="top"><div class="logo"><i></i>K1wi app test 1.0.0</div><div class="count" id="coins">0 selected</div></div>
  <h1>Pick your<br><em>packages.</em></h1>
  <p class="sub">Choose what you want to collect. We'll map the way to every business.</p>
  <div class="tools"><button class="ghost" id="shuffle">↻ Shuffle packages</button></div>
  <div id="list"></div>
</section>
<section id="mapview" class="view"><div id="map"></div>
  <button class="fab" id="info" aria-label="Map credits">ⓘ</button><div id="credit"><a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a></div>
  <button class="fab" id="back">← Packages</button><button class="fab" id="fit">Fit route</button>
  <div id="sheet"></div>
  <div id="nav"><div class="ar" id="nar">↑</div><div><div class="d" id="nd"></div><div class="i" id="ni"></div></div></div>
  <div id="navbar"><div class="e"><b id="eta"></b><span id="rem"></span></div><button class="rb" id="vbtn">🔊</button><button class="end" id="endb">End</button></div></section>
<button id="bar"><span class="t" id="barT"></span><span class="go">Start route →</span></button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ===== CONFIG: replace the coordinates with the real ones ===== */
const COMPANIES=[
 {id:'vicke',name:'Vicke',mono:'V',c:'#ff5a1f',t:'#ffe3d6',lat:20.10110,lng:-98.75910},   // <- Vicke's real location
 {id:'yesi',name:'Yesi',mono:'Y',c:'#6b4eff',t:'#e6e0ff',lat:20.10480,lng:-98.75300},
 {id:'c1',name:'Company 1',mono:'1',c:'#0aa678',t:'#d5f3e8',lat:20.09700,lng:-98.76500},
 {id:'c2',name:'Company 2',mono:'2',c:'#e0287a',t:'#fddbe9',lat:20.10900,lng:-98.76300}
];
const POOL=['Signature gift box','Artisan bakery set','Handcrafted bundle','Care package','Local delicacies','Tasting collection','Botanical arrangement','Coffee starter kit','Scented candle trio','Chocolate box','Weekend discovery kit','Private reserve'];
/* ============================================================== */
const $=s=>document.querySelector(s);
let packs={},sel=new Set(),map,layers=[],bounds;
const sty=c=>`--c:${c.c};--t:${c.t}`;
function shuffleAll(){packs={};sel.clear();COMPANIES.forEach(c=>{
  const p=[...POOL].sort(()=>Math.random()-.5).slice(0,3);
  packs[c.id]=p.map((n,i)=>({key:c.id+i,name:n,price:(Math.floor(Math.random()*18)+5)*10}));});render()}
const chosen=()=>COMPANIES.filter(c=>packs[c.id]&&packs[c.id].some(p=>sel.has(p.key)));
function render(){
 $('#list').innerHTML=COMPANIES.map(c=>`<div class="co" style="${sty(c)}"><div class="ch"><div class="mono">${c.mono}</div><h2>${c.name}</h2><small>3 packages</small></div>`+
  packs[c.id].map(p=>`<button class="pk ${sel.has(p.key)?'sel':''}" data-k="${p.key}"><span class="n">${p.name}<small>$${p.price} MXN</small></span><span class="chk">${sel.has(p.key)?'✓':'+'}</span></button>`).join('')+`</div>`).join('');
 document.querySelectorAll('.pk').forEach(b=>b.onclick=()=>{const k=b.dataset.k;sel.has(k)?sel.delete(k):sel.add(k);render()});
 const n=chosen().length;$('#coins').textContent=sel.size+' selected';
 $('#barT').innerHTML=`${sel.size} package${sel.size>1?'s':''}<small>${n} stop${n>1?'s':''} on your route</small>`;
 $('#bar').classList.toggle('on',n>0);
}
function show(v){$('#pk').classList.toggle('on',v=='pk');$('#mapview').classList.toggle('on',v=='map');
 $('#bar').style.display=v=='map'?'none':'';if(v=='map'&&map)setTimeout(()=>map.invalidateSize(),50)}
$('#shuffle').onclick=shuffleAll;
$('#back').onclick=()=>{endNav(true);show('pk')};
$('#fit').onclick=()=>bounds&&map.fitBounds(bounds,{paddingBottomRight:[0,260]});
$('#bar').onclick=()=>{show('map');startRoute()};
const pin=c=>L.divIcon({className:'',iconSize:[40,40],iconAnchor:[8,38],html:`<div class="pin" style="${sty(c)}"><i>${c.mono}</i></div>`});
function getPos(){return new Promise(res=>{const v=COMPANIES[0],fb={lat:v.lat-.012,lng:v.lng-.009,fake:true};
 if(!navigator.geolocation)return res(fb);
 navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude}),()=>res(fb),{enableHighAccuracy:true,timeout:8000})})}
let R=null,me=null,meM=null,N=null;
const fmt=m=>m<1000?Math.max(10,Math.round(m/10)*10)+' m':(m/1000).toFixed(1)+' km';
const hav=(a,b)=>{const t=Math.PI/180,x=(b.lng-a.lng)*t*Math.cos((a.lat+b.lat)/2*t),y=(b.lat-a.lat)*t;return Math.sqrt(x*x+y*y)*6371000};
const GL={left:'↰',right:'↱','slight left':'↖','slight right':'↗','sharp left':'↲','sharp right':'↳',straight:'↑',uturn:'↶'};
const glyph=s=>{const t=s.maneuver.type;return t=='arrive'?'⚑':(t=='roundabout'||t=='rotary')?'⟳':GL[s.maneuver.modifier]||'↑'};
function instr(s,stop){const t=s.maneuver.type,m=s.maneuver.modifier||'',on=s.name?' onto '+s.name:'';
 if(t=='arrive')return 'Arrive at '+stop;
 if(t=='roundabout'||t=='rotary')return 'Take the roundabout'+on;
 if(m=='uturn')return 'Make a U-turn'+on;
 if(!m||m=='straight')return 'Continue straight'+(s.name?' on '+s.name:'');
 const [a,b]=m.split(' ');return (b?(a=='slight'?'Bear ':'Sharp '):'Turn ')+(b||a)+on}
async function route(pts,prof){
 const base=prof=='foot'?'https://routing.openstreetmap.de/routed-foot/route/v1/foot/':'https://router.project-osrm.org/route/v1/driving/';
 const r=await fetch(base+pts.map(p=>p.lng+','+p.lat).join(';')+'?overview=full&geometries=geojson&steps=true');
 const j=await r.json();if(!j.routes||!j.routes[0])throw 0;return j.routes[0]}
async function startRoute(){
 endNav(true);
 if(!map){map=L.map('map',{zoomControl:false,attributionControl:false});
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map)}
 layers.forEach(l=>map.removeLayer(l));layers=[];
 $('#sheet').innerHTML='<b style="font:800 20px var(--d)">Finding the best way…</b>';
 me=await getPos();
 const stops=[...chosen()].sort((a,b)=>(a.id=='vicke'?-1:b.id=='vicke'?1:0)); // Vicke is always the first stop
 const pts=[me,...stops];
 meM=L.marker([me.lat,me.lng],{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[18,18],iconAnchor:[9,9]}),zIndexOffset:1000}).addTo(map);layers.push(meM);
 stops.forEach(c=>layers.push(L.marker([c.lat,c.lng],{icon:pin(c)}).addTo(map)));
 let line,dist=0,dur=0,note='Walking',steps=[];
 try{let r;try{r=await route(pts,'foot')}catch(e){r=await route(pts,'car');note='Driving'}
  line=r.geometry.coordinates.map(c=>[c[1],c[0]]);dist=r.distance;dur=r.duration;
  r.legs.forEach((l,i)=>l.steps.forEach(s=>steps.push({...s,leg:i})));
 }catch(e){line=pts.map(p=>[p.lat,p.lng]);note='Direct line'}
 const remD=[0],remT=[0];for(let i=steps.length-1;i>=0;i--){remD[i]=(remD[i+1]||0)+steps[i].distance;remT[i]=(remT[i+1]||0)+steps[i].duration}
 R={steps,stops,line,dist,dur,note,remD,remT};
 layers.push(L.polyline(line,{color:'#fff',weight:11,opacity:.95}).addTo(map));
 layers.push(L.polyline(line,{color:'#15171c',weight:4,className:'route'}).addTo(map));
 bounds=L.latLngBounds(pts.map(p=>[p.lat,p.lng])).pad(.25);
 map.fitBounds(bounds,{paddingBottomRight:[0,260]});
 const eta=new Date(Date.now()+dur*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
 $('#sheet').innerHTML=`<div class="stats"><div class="stat"><b>${dur?Math.round(dur/60):'–'}</b><span>min · ${dur?'arrive '+eta:''}</span></div><div class="stat"><b>${dist?(dist/1000).toFixed(1):'–'}</b><span>km · ${note}</span></div></div>`+
  (steps.length?`<button class="startbtn" id="go">▶ Start navigation</button><div class="row"><button class="ghost" id="sim">Simulate trip (demo)</button><a class="ghost" target="_blank" rel="noopener" href="${gmaps()}">Open in Google Maps</a></div>`:'<p class="note">Turn-by-turn is unavailable right now (routing offline).</p>')+
  `<p class="note">${stops.length} stop${stops.length>1?'s':''}${me.fake?' · Location unavailable, using a demo start point':''} · Tap a stop to mark it done</p><div class="tl">`+
  stops.map((c,i)=>{const n=packs[c.id].filter(p=>sel.has(p.key)).map(p=>p.name).join(', ');
   return `<div class="st" style="${sty(c)}"><div class="b">${i+1}</div><div><b>${c.name}</b><small>${n}</small></div></div>`}).join('')+'</div>';
 document.querySelectorAll('.st').forEach(e=>e.onclick=()=>e.classList.toggle('done'));
 if(steps.length){$('#go').onclick=()=>startNav(false);$('#sim').onclick=()=>startNav(true)}
}
function gmaps(){const s=R.stops,d=s[s.length-1],w=s.slice(0,-1).map(c=>c.lat+','+c.lng).join('|');
 return 'https://www.google.com/maps/dir/?api=1'+(me.fake?'':'&origin='+me.lat+','+me.lng)+'&destination='+d.lat+','+d.lng+(w?'&waypoints='+encodeURIComponent(w):'')+'&travelmode='+(R.note=='Driving'?'driving':'walking')}
function dens(l,st){const o=[];for(let i=0;i<l.length-1;i++){const a={lat:l[i][0],lng:l[i][1]},b={lat:l[i+1][0],lng:l[i+1][1]},n=Math.max(1,Math.round(hav(a,b)/st));for(let j=0;j<n;j++)o.push({lat:a.lat+(b.lat-a.lat)*j/n,lng:a.lng+(b.lng-a.lng)*j/n})}const e=l[l.length-1];o.push({lat:e[0],lng:e[1]});return o}
function say(t){if(N&&N.voice&&window.speechSynthesis){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}}
let ct;$('#info').onclick=()=>{const c=$('#credit');c.classList.toggle('on');clearTimeout(ct);if(c.classList.contains('on'))ct=setTimeout(()=>c.classList.remove('on'),5000)};
function startNav(sim){
 document.body.classList.add('navmode');$('#nav').classList.add('on');$('#navbar').classList.add('on');
 N={k:0,voice:true,last:-1,watch:null,tm:null};$('#vbtn').textContent='🔊';
 if(sim){const pts=dens(R.line,6);let i=0;N.tm=setInterval(()=>{if(i>=pts.length){clearInterval(N.tm);return}update(pts[i++])},400)}
 else{update({lat:me.lat,lng:me.lng});N.watch=navigator.geolocation.watchPosition(p=>update({lat:p.coords.latitude,lng:p.coords.longitude}),()=>{},{enableHighAccuracy:true})}
}
function update(p){
 if(!N)return;const S=R.steps;
 meM.setLatLng([p.lat,p.lng]);map.setView([p.lat,p.lng],17,{animate:true});
 for(;;){const t=S[N.k+1];if(!t)return;
  if(hav(p,{lat:t.maneuver.location[1],lng:t.maneuver.location[0]})>25)break;
  N.k++;
  if(t.maneuver.type=='arrive'){const st=R.stops[t.leg];document.querySelectorAll('.st')[t.leg].classList.add('done');
   if(t.leg==R.stops.length-1)return arrived(st);
   N.k++;say('Arrived at '+st.name)}}
 const t=S[N.k+1],d=hav(p,{lat:t.maneuver.location[1],lng:t.maneuver.location[0]}),stop=R.stops[t.leg].name,tx=instr(t,stop);
 $('#nar').textContent=glyph(t);$('#nd').textContent=fmt(d);$('#ni').textContent=tx;
 const rem=d+R.remD[N.k+1],sec=R.remT[N.k+1]+d*(R.dur/R.dist||0);
 $('#eta').textContent=new Date(Date.now()+sec*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
 $('#rem').textContent=Math.max(1,Math.round(sec/60))+' min · '+fmt(rem);
 if(N.last!=N.k){N.last=N.k;say((d>40?'In '+fmt(d)+', ':'')+tx)}
}
function arrived(st){$('#nar').textContent='⚑';$('#nd').textContent='Arrived';$('#ni').textContent='You reached '+st.name;$('#rem').textContent='Route complete';
 if(N.tm)clearInterval(N.tm);if(N.watch!=null)navigator.geolocation.clearWatch(N.watch);say('You have arrived at '+st.name)}
function endNav(quiet){
 if(N){if(N.tm)clearInterval(N.tm);if(N.watch!=null)navigator.geolocation.clearWatch(N.watch);if(window.speechSynthesis)speechSynthesis.cancel();N=null}
 document.body.classList.remove('navmode');$('#nav').classList.remove('on');$('#navbar').classList.remove('on');
